[workspace]
resolver = "2"
members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getforma-dev/gatewasm"

[workspace.dependencies]
forma-ir = "0.1.4"
forma-server = "0.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Local framework patches (CSP style-src fix pending publish):
[patch.crates-io]
forma-ir = { path = "../FormaStack/forma/crates/forma-ir" }
forma-server = { path = "../FormaStack/forma/crates/forma-server" }
