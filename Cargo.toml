[workspace]
resolver = "2"
members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/getforma-dev/gatewasm"

[workspace.dependencies]
forma-ir = "0.2.0"
forma-server = "0.2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Uncomment for local framework development:
# [patch.crates-io]
# forma-ir = { path = "../forma-repo/crates/forma-ir" }
# forma-server = { path = "../forma-repo/crates/forma-server" }
