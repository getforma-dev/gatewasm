name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  custody-infrastructure:
    name: Managed key custody infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Validate synthesized key permissions and runtime configuration
        run: |
          npm ci --prefix infra
          npm test --prefix infra
      - name: Validate managed key rotation controls
        run: python3 -m unittest discover -s handoff/forma-248 -p 'test_*.py'

  # Deliberately has no `needs:` and no admin build. The three cargo jobs all
  # gate on `frontend`, so when workspace resolution broke in March the failure
  # surfaced late and looked like a test failure. This fails in about a minute
  # and names the real cause.
  lockfile:
    name: Lockfile integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
      - name: Workspace resolves against the committed lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: No path-sourced third-party crates
        # A `[patch.crates-io]` entry pointing outside the repo cannot be built
        # by CI or by `docker build`, whose context is the repo root, and it
        # strips the source/checksum pinning from Cargo.lock.
        run: |
          if grep -q '^\[patch\.' Cargo.toml; then
            echo "::error file=Cargo.toml::[patch.*] section present; third-party crates must come from the registry"
            exit 1
          fi

  frontend:
    name: Frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install and validate
        working-directory: admin
        run: |
          npm ci
          npx tsc --noEmit
          npx tsx build.ts --ssr
      # The compiler prints one diagnostic per construct it cannot render
      # server-side. They scrolled past unread for months while /platform/login
      # served its "New here?" link with no href. This does not fix them; it
      # stops the count rising.
      - name: SSR degradations have not regressed
        working-directory: admin
        run: npm run check:ssr

      # A component can name a CSS class that no stylesheet on its route
      # defines; nothing errors, the element just renders unstyled. That is
      # how tenant admin shipped ghost buttons and an unstyled modal. Same
      # contract as the SSR gate: the count may only fall.
      - name: CSS class references have not regressed
        working-directory: admin
        run: npm run check:css

  unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build admin assets
        working-directory: admin
        run: |
          npm ci
          npx tsx build.ts --ssr
      - name: Run unit tests
        run: cargo test -p gatewasm-server --lib
      # Every warning stream has a committed baseline that can only go down.
      # clippy::string_slice found an unauthenticated process abort in the token
      # endpoint only because its count was zero, so a new one stood out. This
      # keeps that property for every lint, and for the bundle budgets.
      # Second landing: a collector whose command fails or emits no evidence of
      # a completed run now ABORTS the gate — the first landing read 0 in CI
      # while `|| true` swallowed the reason (reverted in c7651c1).
      - name: Warning budgets have not regressed
        run: bash scripts/check-warning-budget.sh

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatewasm
          POSTGRES_PASSWORD: gatewasm
          POSTGRES_DB: gatewasm_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gatewasm -d gatewasm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gatewasm:gatewasm@localhost:5433/gatewasm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - name: Build admin assets
        working-directory: admin
        run: |
          npm ci
          npx tsx build.ts --ssr
      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Run integration tests
        run: cargo test -p gatewasm-server --test integration -- --nocapture

  e2e-tests:
    name: E2E smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatewasm
          POSTGRES_PASSWORD: gatewasm
          POSTGRES_DB: gatewasm_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gatewasm -d gatewasm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
      - name: Build admin assets
        working-directory: admin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx tsx build.ts --ssr
      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      # Prebuild so globalSetup's `cargo run` starts the server instead of
      # compiling it. Without this the e2e job pays for a second full build
      # inside the health-check window and times out before any test runs.
      - name: Build server
        run: cargo build -p gatewasm-server
      - name: Run e2e smoke tests
        working-directory: admin
        run: npx playwright test --grep @smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/test-results/
          retention-days: 7
