name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberately has no `needs:` and no admin build. The three cargo jobs all
  # gate on `frontend`, so when workspace resolution broke in March the failure
  # surfaced late and looked like a test failure. This fails in about a minute
  # and names the real cause.
  lockfile:
    name: Lockfile integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Workspace resolves against the committed lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: No path-sourced third-party crates
        # A `[patch.crates-io]` entry pointing outside the repo cannot be built
        # by CI or by `docker build`, whose context is the repo root, and it
        # strips the source/checksum pinning from Cargo.lock.
        run: |
          if grep -q '^\[patch\.' Cargo.toml; then
            echo "::error file=Cargo.toml::[patch.*] section present; third-party crates must come from the registry"
            exit 1
          fi

  frontend:
    name: Frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install and validate
        working-directory: admin
        run: |
          npm ci
          npx tsc --noEmit
          npx tsx build.ts --ssr

  unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build admin assets
        working-directory: admin
        run: |
          npm ci
          npx tsx build.ts --ssr
      - name: Run unit tests
        run: cargo test -p gatewasm-server --lib

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatewasm
          POSTGRES_PASSWORD: gatewasm
          POSTGRES_DB: gatewasm_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gatewasm -d gatewasm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gatewasm:gatewasm@localhost:5433/gatewasm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build admin assets
        working-directory: admin
        run: |
          npm ci
          npx tsx build.ts --ssr
      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Run integration tests
        run: cargo test -p gatewasm-server --test integration -- --nocapture

  e2e-tests:
    name: E2E smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatewasm
          POSTGRES_PASSWORD: gatewasm
          POSTGRES_DB: gatewasm_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gatewasm -d gatewasm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build admin assets
        working-directory: admin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx tsx build.ts --ssr
      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Run e2e smoke tests
        working-directory: admin
        run: npx playwright test --grep @smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/test-results/
          retention-days: 7
