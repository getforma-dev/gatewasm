[package]
name = "gatewasm-server"
version.workspace = true
edition.workspace = true
rust-version = "1.93"
license.workspace = true
description = "Reference auth server implementation for the GateWASM protocol"

[dependencies]
aws-config = "=1.8.18"
aws-sdk-kms = "=1.111.0"
forma-ir = { workspace = true }
forma-server = { workspace = true }
axum = { version = "0.8", features = ["macros", "ws"] }
dashmap = "6"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
url = "2"
urlencoding = "2"
reqwest = { version = "0.12", features = ["json"] }
ring = "0.17"
pem = "3"
governor = "0.10"
tower_governor = "0.8"
data-encoding = "2"
qrcode = "0.14"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
resend-rs = { version = "0.22", default-features = false, features = ["rustls-tls"] }
subtle = "2"
serde_urlencoded = "0.7"
rust-embed = "8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
chrono = "0.4"
# `parser::test_helpers` moved behind a non-default feature in forma-ir 0.2.0.
forma-ir = { workspace = true, features = ["test-helpers"] }
# Needed so tracing macro fields are actually evaluated in tests: without a
# subscriber they are skipped, and a panic inside one goes unnoticed.
tracing-subscriber = "0.3"
